name: Build BlockWars

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Find project folder
        id: proj
        run: |
          file=$(find . -name settings.gradle -not -path "./.git/*" | head -n 1)
          if [ -z "$file" ]; then
            echo "No se encontro settings.gradle. Archivos en el repositorio:"
            find . -not -path "./.git/*" | head -n 100
            exit 1
          fi
          echo "dir=$(dirname "$file")" >> "$GITHUB_OUTPUT"
          echo "Proyecto encontrado en: $(dirname "$file")"

      # The sources travel as src.zip (GitHub's web uploader only allows 100 files at a time).
      # Since 5.0 every src.zip carries src/blockwars-version.txt: if the repository holds more than one
      # src.zip, the one with the highest version wins (zips without the file count as version 0; ties: the biggest).
      - name: Unpack sources
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          list=$(mktemp)
          while IFS= read -r -d '' z; do
            v=$(unzip -p "$z" src/blockwars-version.txt 2>/dev/null | tr -d '\r\n ')
            [ -n "$v" ] || v=0
            s=$(stat -c %s "$z")
            printf '%s\t%s\t%s\n' "$v" "$s" "$z" >> "$list"
          done < <(find "$GITHUB_WORKSPACE" -name 'src*.zip' -not -path "*/.git/*" -print0)
          echo "src.zip encontrados (version, tamaño, ruta):"
          sort -t$'\t' -k1,1V -k2,2n "$list"
          best=$(sort -t$'\t' -k1,1V -k2,2n "$list" | tail -n 1)
          zipfile=$(printf '%s' "$best" | cut -f3-)
          version=$(printf '%s' "$best" | cut -f1)
          if [ -n "$zipfile" ]; then
            echo "Usando: $zipfile (version $version)"
            rm -rf src
            unzip -q -o "$zipfile" -d .
          fi
          if [ -n "$version" ] && [ "$version" != "0" ]; then
            # the jar is named after the sources it was built from
            sed -i "s/^mod_version=.*/mod_version=$version/" gradle.properties
          fi
          echo "Archivos Java: $(find src -name '*.java' | wc -l)"
          echo "Version: $(grep mod_version gradle.properties)"

      - name: Build with Gradle
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          gradle build
          ls -l build/libs

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: blockwars-mod
          path: '**/build/libs/*.jar'
