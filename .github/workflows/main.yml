name: Build BlockWars

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Find project folder
        id: proj
        run: |
          file=$(find . -name settings.gradle -not -path "./.git/*" | head -n 1)
          if [ -z "$file" ]; then
            echo "No se encontro settings.gradle. Archivos en el repositorio:"
            find . -not -path "./.git/*" | head -n 100
            exit 1
          fi
          echo "dir=$(dirname "$file")" >> "$GITHUB_OUTPUT"
          echo "Proyecto encontrado en: $(dirname "$file")"

      # The sources travel as src.zip (GitHub's web uploader only allows 100 files at a time)
      - name: Unpack sources
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          zipfile=$(find "$GITHUB_WORKSPACE" -name src.zip -not -path "*/.git/*" | head -n 1)
          if [ -n "$zipfile" ]; then
            echo "Descomprimiendo $zipfile"
            rm -rf src
            unzip -q -o "$zipfile" -d .
          fi
          echo "Archivos Java: $(find src -name '*.java' | wc -l)"

      - name: Build with Gradle
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: blockwars-mod
          path: '**/build/libs/*.jar'
